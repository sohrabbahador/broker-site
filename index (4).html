<style>
:root{--pr:#0E5A57;--pr2:#E1F0EF;--ac:#C98A12;--tx:#17282E;--mu:#5F727A;--ln:#DAE3E6;--bg:#F4F7F7}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.9}
.w{max-width:960px;margin:0 auto;padding:0 18px}

.t{font-size:18px;font-weight:700;color:#F2C86B}
.en{letter-spacing:.2em;font-size:12px;opacity:.7;direction:ltr}
.hero p{max-width:520px;margin:14px auto 20px;opacity:.94}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta{display:inline-block;background:var(--ac);color:#fff;border-radius:10px;padding:8px 22px;font-weight:700;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.cta.o{background:transparent;border:1.5px solid rgba(255,255,255,.7)}
.hero .cta:not(.o){position:relative;overflow:hidden;background:linear-gradient(135deg,#9A6A0A 0%,#F3D77A 30%,#E2B33F 52%,#B8860B 78%,#F0CF70 100%);color:#2B1B02;text-shadow:0 1px 0 rgba(255,255,255,.45);border:1px solid rgba(255,236,170,.8);box-shadow:0 8px 22px rgba(201,138,18,.5),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 4px rgba(120,80,0,.35);padding:10px 34px;font-size:16px}
.hero .cta:not(.o)::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
@keyframes sh{0%{left:-60%}55%,100%{left:130%}}
.cta.s{padding:3px 16px;font-size:14px;background:var(--pr)}
main{margin-top:-36px;padding-bottom:36px}
.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:19px}
.ch{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cc{display:flex;align-items:center;gap:12px;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;background:var(--bg)}
.cc i{font-style:normal;font-size:26px}.cc div{flex:1;min-width:0}.cc b{display:block}.cc span{color:var(--mu);font-size:13px;overflow-wrap:anywhere}.cc span.cta{color:#fff;font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:4px 18px;font:inherit;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.c{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px}
.c h3{margin:6px 0 2px;font-size:17px}
.m,.x{margin:0;color:var(--mu);font-size:14px}
.p{font-weight:800;font-size:18px;margin:10px 0;color:var(--pr)}
.b{display:inline-block;border-radius:6px;padding:0 10px;font-size:12px;font-weight:700;background:var(--pr2);color:var(--pr)}
.b.r{background:#FBF1DC;color:var(--ac)}
.e{color:var(--mu);text-align:center;padding:26px}
.cc{padding:10px 14px;gap:10px}.cc i{font-size:22px}.cc div{text-align:right}.cc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;display:block}.cc span.go{color:var(--pr);font-size:26px;line-height:1;direction:rtl;flex:none;overflow:visible}
footer{border-top:1px solid var(--ln);padding:22px 0;color:var(--mu);font-size:14px;text-align:center}
</style></head><body>
<header class="hero"><div class="w">
<div class="av"><svg width="54" height="54" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0E5A57"/><polygon points="256,110 400,240 112,240" fill="#fff"/><rect x="152" y="240" width="208" height="150" fill="#fff"/><rect x="226" y="300" width="60" height="90" fill="#C98A12"/></svg></div>
<h1>سهراب بهادر</h1><div class="t">بروکر املاک</div><div class="en">BROKER AMLAK</div>
<p id="bio"></p><div class="act" id="act"></div></div></header>
<main class="w">
<section class="box" id="abs"><h2>درباره‌ی ما</h2><p id="ab" style="margin:0"></p></section>
<section class="box" id="chs"><h2>راه‌های ارتباط</h2><div class="ch" id="ch"></div></section>
<section class="box" id="fl"><h2>فایل‌های ملکی</h2><div class="bar" id="bar"></div><div class="g" id="g"></div></section>
</main>
<footer><div class="w" id="ft"></div></footer>
<script type="application/json" id="d">{"f":[],"ph":"09123692401,09003692401","ad":"","bio":"BROKER AMLAK مبتکر خدمات هوشمند ملکی","ab":"","bl":"BROKER_amlak","ig":"broker_amlak.ir","ap":""}</script>
<script>
var D=JSON.parse(document.getElementById('d').textContent),flt='همه';
function $(i){return document.getElementById(i)}
function P(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function N(n){return Number(n||0).toLocaleString('fa-IR')}
function F(m){if(m>=1000){var b=Math.floor(m/1000),r=Math.round(m%1000);return N(b)+' میلیارد'+(r?' و '+N(r)+' میلیون':'')+' تومان'}return N(m)+' میلیون تومان'}
function E(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function L(v,b){v=String(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;return b+v.replace(/^@/,'').replace(/^\/+/,'')}
function HD(u){u=String(u).split('?')[0].split('#')[0];var p=u.split('/').filter(function(x){return x});return '@'+(p[p.length-1]||'').replace('@','')}
var PH=String(D.ph||'').split(/[,،]+/).map(function(x){return x.trim()}).filter(Boolean);
var bl=L(D.bl,'https://ble.ir/'),ig=L(D.ig,'https://instagram.com/'),ap=L(D.ap,'');
$('bio').textContent=D.bio||'BROKER AMLAK مبتکر خدمات هوشمند ملکی';
if(D.ab)$('ab').textContent=D.ab;else $('abs').style.display='none';
var a='';if(PH[0])a+='<a class="cta" href="tel:'+E(PH[0])+'">تماس با من</a>';if(ap)a+='<a class="cta o" href="'+E(ap)+'">دانلود اپ</a>';$('act').innerHTML=a;
var c='';
if(bl)c+='<a class="cc" target="_blank" rel="noopener" href="'+E(bl)+'"><i>💬</i><div><b>کانال بله</b><span>'+E(HD(bl))+'</span></div><span class="go">‹</span></a>';
if(ig)c+='<a class="cc" target="_blank" rel="noopener" href="'+E(ig)+'"><i>📷</i><div><b>اینستاگرام</b><span>'+E(HD(ig))+'</span></div><span class="go">‹</span></a>';
PH.forEach(function(p){c+='<a class="cc" href="tel:'+E(p)+'"><i>📞</i><div><b>شماره تماس</b><span dir="ltr">'+P(E(p))+'</span></div><span class="go">‹</span></a>'});
if(c)$('ch').innerHTML=c;else $('chs').style.display='none';
$('ft').innerHTML='سهراب بهادر · بروکر املاک'+(D.ad?'<br>'+E(D.ad):'');
function setF(f){flt=f;draw()}
function draw(){
 if(!D.f.length){$('bar').style.display='none';$('g').innerHTML='<p class="e">در حال حاضر فایلی برای نمایش نیست. برای دریافت فایل‌های جدید تماس بگیرید یا کانال‌ها را دنبال کنید.</p>';return}
 $('bar').innerHTML=['همه'].concat(['فروش','رهن و اجاره','خرید','تهاتر'].filter(function(t){return D.f.some(function(f){return f.ty===t})})).map(function(x){return '<button class="chip'+(flt===x?' on':'')+'" data-f="'+x+'" onclick="setF(this.dataset.f)">'+x+'</button>'}).join('');
 var h='';D.f.filter(function(f){return flt==='همه'||f.ty===flt}).forEach(function(f){
  h+='<article class="c"><span class="b'+(f.ty==='فروش'?'':' r')+'">'+E(f.ty)+'</span><h3>'+E(f.t)+'</h3><p class="m">'+E(f.a)+' · '+N(f.m)+' متر · '+N(f.r)+' خواب'+(f.f&&f.f!=='—'?' · طبقه '+E(f.f):'')+'</p><p class="x">'+E(f.x)+'</p><div class="p">'+({'رهن و اجاره':'رهن ','خرید':'بودجه ','تهاتر':'ارزش '}[f.ty]||'')+F(f.p)+'</div>'+(PH[0]?'<a class="cta s" href="tel:'+E(PH[0])+'">تماس برای بازدید</a>':'')+'</article>'});
 $('g').innerHTML=h||'<p class="e">فایلی در این دسته نیست.</p>';
}
draw();
</script></body></html>
