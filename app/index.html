const KEY='ba_state_v1';
function stat(t,c){const e=$('#st');if(e){e.textContent=t;e.style.color=c||''}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({files:S.files,cus:S.cus,vis:S.vis,deals:S.deals,goal:S.goal,prof:S.prof}));stat('✓ ذخیره شد روی این دستگاه');schedPub()}catch(e){stat('⚠ ذخیره روی این دستگاه انجام نشد؛ حتماً «پشتیبان‌گیری» بزنید','#c0392b')}}

function backup(){const b=new Blob([JSON.stringify({files:S.files,cus:S.cus,vis:S.vis,deals:S.deals,goal:S.goal,prof:S.prof})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='broker-amlak-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadState(JSON.parse(r.result));persist();render()}catch(e){stat('⚠ فایل پشتیبان معتبر نیست','#c0392b')}};r.readAsText(f)}
const GK='ba_gh_v1';

function ghs(c){localStorage.setItem(GK,JSON.stringify(c))}
function hsh(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h+':'+t.length}
let PT=null,PB=false;
function schedPub(){const c=ghc();if(!c||!c.auto)return;clearTimeout(PT);PT=setTimeout(()=>pubSite(false),2500)}
async function pubSite(force){
 const c=ghc();if(!c){stat('⚠ اول «اتصال به سایت» را انجام دهید','#c0392b');return}
 const html=buildShowcase(S.files,S.prof),h=hsh(html);
 if(!force&&c.last===h)return;

 PB=true;stat('… در حال انتشار در سایت');
 try{
  const br=await ghBranch(c),api='https://api.github.com/repos/'+c.repo+'/contents/index.html',H={Authorization:'Bearer '+c.tk,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const bytes=new TextEncoder().encode(html);let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));

   const g=await fetch(api+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:H,cache:'no-store'});
   if(!g.ok)throw new Error('S'+g.status);
   const sha=(await g.json()).sha;
   const r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'update showcase',content:btoa(bin),sha:sha,branch:br})});
   if(r.ok){c.last=h;ghs(c);stat('✓ ویترین سایت به‌روز شد؛ تا یکی دو دقیقه دیگر در سایت دیده می‌شود');return true}
   if(r.status!==409&&r.status!==422)throw new Error('S'+r.status)
  }

 }catch(e){const m=String(e.message);stat(/S40[134]/.test(m)?'⚠ توکن نامعتبر است یا به این مخزن دسترسی ندارد':'⚠ انتشار انجام نشد (اینترنت یا VPN؟)؛ با تغییر بعدی یا دکمه‌ی «انتشار همین الان» دوباره امتحان می‌شود','#c0392b');return false}
 finally{PB=false}
}


const GH_API='https://api.github.com/repos/';
const encPath=s=>s.split('/').map(encodeURIComponent).join('/');
const thumbPath=p=>p.replace(/^(images\/[^/]+)\/([^/]+?)(\.[^./]+)?$/,'$1/t/$2.webp');
function ghHeaders(c){return{Authorization:'Bearer '+c.tk,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
async function ghBranch(c){
 if(c.br)return c.br;
 try{const r=await fetch(GH_API+c.repo+'?_='+Date.now(),{headers:ghHeaders(c),cache:'no-store'});
  if(r.ok){const j=await r.json();if(j&&j.default_branch){c.br=j.default_branch;const cur=ghc();if(cur&&cur.repo===c.repo){cur.br=c.br;ghs(cur)}return c.br}}
 }catch(e){}
 return 'main';
}
function b64json(o){const bytes=new TextEncoder().encode(JSON.stringify(o,null,2));let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
async function ghPutFile(c,path,content){
 const H=ghHeaders(c),br=await ghBranch(c),url=GH_API+c.repo+'/contents/'+encPath(path);
 const g=await fetch(url+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:H,cache:'no-store'});
 if(g.ok)return 'exists';if(g.status!==404)throw new Error('S'+g.status);
 const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Upload property photo',content,branch:br})});
 if(!r.ok)throw new Error('S'+r.status);return 'new';
}
async function ghDeleteFile(c,path){
 const H=ghHeaders(c),br=await ghBranch(c),url=GH_API+c.repo+'/contents/'+encPath(path);
 const g=await fetch(url+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:H,cache:'no-store'});
 if(g.status===404)return false;if(!g.ok)throw new Error('S'+g.status);
 const j=await g.json();
 const d=await fetch(url,{method:'DELETE',headers:H,body:JSON.stringify({message:'Delete property photo',sha:j.sha,branch:br})});
 if(!d.ok&&d.status!==404)throw new Error('S'+d.status);return true;
}
async function updateManifest(c,mutate){
 const H=ghHeaders(c),br=await ghBranch(c),url=GH_API+c.repo+'/contents/images/manifest.json';
 for(let t=0;t<4;t++){
  let manifest={},sha=null;
  const g=await fetch(url+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:H,cache:'no-store'});
  if(g.ok){const j=await g.json();sha=j.sha;try{manifest=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),x=>x.charCodeAt(0))))}catch(e){throw new Error('manifest-invalid')}}
  else if(g.status!==404)throw new Error('S'+g.status);
  if(!manifest||typeof manifest!=='object'||Array.isArray(manifest))throw new Error('manifest-invalid');
  const out=mutate(manifest)||manifest;
  const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Update property photo gallery',content:b64json(out),...(sha?{sha}:{}),branch:br})});
  if(r.ok)return out;
  if(r.status!==409&&r.status!==422)throw new Error('S'+r.status);
  await new Promise(res=>setTimeout(res,400*(t+1)));
 }
 throw new Error('manifest-conflict');
}
async function propertyPhotoVariants(file){
 let bitmap;try{bitmap=await createImageBitmap(file)}catch(e){return{full:file,thumb:null}}
 const draw=async(max,q)=>{const s=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),w=Math.max(1,Math.round(bitmap.width*s)),h=Math.max(1,Math.round(bitmap.height*s)),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d',{alpha:false}).drawImage(bitmap,0,0,w,h);const b=await new Promise(r=>cv.toBlob(r,'image/webp',q));cv.width=cv.height=0;return b&&b.type==='image/webp'?b:null};
 try{const full=await draw(1600,.82),thumb=full?await draw(640,.74):null;return{full:full||file,thumb}}
 finally{bitmap.close&&bitmap.close()}
}
async function blobHash(blob){
 try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return Array.from(new Uint8Array(d).slice(0,6),x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

async function optimizePropertyPhoto(file){

function buildShowcase(files,prof){
 const pubs=(files||[]).filter(f=>f.st==='فعال'&&f.pub!==false).map(f=>({id:f.id,t:f.t,a:f.a,ty:f.ty,cat:f.cat||'',p:f.p,m:f.m,r:f.r,f:f.f,x:f.x}));
 const pr=prof||{};
 const data=JSON.stringify({f:pubs,ph:pr.ph||'',ad:pr.ad||'',bio:pr.bio||'',ab:(pr.ab&&pr.ab!=="*سهراب بهادر* در بازار املاک، به‌عنوان شخصیتی اثرگذار و آینده‌ساز شناخته می‌شود؛ فردی که با *کسب علم و تجربه‌ی میدانی*، معیار تازه‌ای از اعتماد و کیفیت را در خدمات املاک ایجاد کرده است.\nاو فراتر از معاملات ملکی، با رویکردی علمی و نقش‌آفرینی به‌عنوان **کوچینگ و منتور حرفه‌ای**، مسیر رشد و ارتقای *مشاوران* و *مدیران دفاتر املاک* را هموار و موفق ساخته است.\nایشان با تمرکز بر **خدمات ملکی مدرن، آموزش تخصصی و کوچینگ مدیریتی**، الگویی نوین از کار حرفه‌ای ارائه می‌دهد؛ الگویی که هم مشتریان و هم فعالان بازار از آن بهره‌مند می‌شوند.\n**سهراب بهادر؛ مبتکر خدمات هوشمند ملکی، کوچینگ و منتورینگ حرفه‌ای در بازار املاک ایران.**"?pr.ab:ABOUT_DEF),bl:pr.bl||'',ig:pr.ig||'',ap:pr.ap||''}).replace(/</g,'\\u003c');
 const phoneJson=JSON.stringify(String(pr.ph||'').split(/[,،]+/).map(x=>x.trim()).filter(Boolean).map(x=>'+98'+x.replace(/^\+?98/, '').replace(/^0/,'')));
 const sameAs=JSON.stringify([pr.bl?(/^https?:\/\//i.test(pr.bl)?pr.bl:'https://ble.ir/'+String(pr.bl).replace(/^@|^\/+/,'')):null,pr.ig?(/^https?:\/\//i.test(pr.ig)?pr.ig:'https://instagram.com/'+String(pr.ig).replace(/^@|^\/+/,'')):null].filter(Boolean));
 return SHOWCASE_TEMPLATE.replace('__BROKER_DATA__',()=>data).replace('__BROKER_PHONE_JSON__',()=>phoneJson).replace('__BROKER_SAMEAS_JSON__',()=>sameAs);
}

 const L=S.files.filter(f=>S.flt==='همه'||f.ty===S.flt);
 return `<div class="bar"><div class="chips">${['همه',...TY].map(c=>`<button class="chip ${S.flt===c?'on':''}" onclick="setF('${c}')">${c}</button>`).join('')}</div><button class="btn" onclick="addFile()">فایل جدید</button></div>
 <div class="grid">${L.map(f=>`<div class="card"><span class="badge ${f.ty==='فروش'?'':'r'}">${f.ty}</span> <span class="meta">${f.st}</span><h3 style="margin-top:6px">${esc(f.t)}</h3><div class="meta">${esc(f.a)} · ${N(f.m)} متر · ${N(f.r)} خواب<br>مالک: ${esc(f.ow||'—')} ${f.op?`<a href="tel:${esc(f.op)}">تماس</a>`:''}</div><div class="price">${PL[f.ty]||''}${fmt(f.p)}</div><div class="meta">کمیسیون: ${fmt(f.cm||0)}</div>${nc(f)?`<div class="match">${N(nc(f))} مشتری مناسب دارید</div>`:''}${PHOTO_COUNTS[f.id]?`<div class="meta" style="margin-top:8px">🖼 ${N(PHOTO_COUNTS[f.id])} تصویر ثبت‌شده</div>`:''}${PHOTO_PREVIEWS[f.id]?.length?`<div style="display:flex;gap:7px;overflow-x:auto;margin:10px 0;padding:4px 0;align-items:center">${PHOTO_PREVIEWS[f.id].map(u=>`<img src="${u}" style="width:76px;height:64px;object-fit:cover;border-radius:8px;flex:0 0 auto;border:1px solid #bbb">`).join('')}<span class="meta" style="white-space:nowrap">${PHOTO_STATUS[f.id]||'پیش‌نمایش عکس‌ها'}</span></div>`:''}<div class="mv"><button class="btn sm" onclick="choosePhoto('${f.id}')">بارگذاری عکس</button><button class="btn ghost sm" onclick="ad('${f.id}')">ارائه به مشتری</button><button class="btn ghost sm" onclick="editFile('${f.id}')">ویرایش</button><button class="btn ghost sm" onclick="del('f','${f.id}')">${S.cf==='f'+f.id?'تأیید حذف':'حذف'}</button></div></div>`).join('')||'<p class="empty">فایلی ثبت نشده. اولین فایل را اضافه کنید.</p>'}</div>`},
crm(){
 return `<div class="bar"><h2 style="margin:0">مسیر فروش</h2><button class="btn" onclick="addCus()">مشتری جدید</button></div>
 <div class="board">${STAGES.map((s,si)=>{const L=S.cus.map((c,i)=>({c,i})).filter(x=>x.c.s===si);
 return `<section class="col"><h3>${s}<span class="meta">${N(L.length)}</span></h3>${L.map(({c,i})=>`<div class="card"><b>${esc(c.n)}</b><div class="meta">${c.ty==='فروش'?'خرید':c.ty} · تا ${fmt(c.b)}<br>${esc(c.a)} · <a dir="ltr" href="tel:${esc(c.p)}">${P(esc(c.p))}</a><br>${N(c.pr.length)} فایل ارائه‌شده · ${N(ago(c.lc))} روز از آخرین تماس</div>${c.nt?`<div class="meta" style="white-space:pre-wrap;margin-top:6px">📝 ${esc(c.nt)}</div>`:''}${nm(c)?`<div class="match">${N(nm(c))} فایل مناسب دارید</div>`:''}<div class="mv"><button class="btn ghost sm" ${si===4?'disabled':''} onclick="mv(${i},1)">مرحله بعد</button><button class="btn ghost sm" ${si===0?'disabled':''} onclick="mv(${i},-1)">قبلی</button><button class="btn ghost sm" onclick="touch('${c.id}')">ثبت تماس</button><button class="btn ghost sm" onclick="editCus('${c.id}')">ویرایش</button><button class="btn ghost sm" onclick="note('${c.id}')">${c.nt?'ویرایش یادداشت':'یادداشت'}</button><button class="btn ghost sm" onclick="del('c','${c.id}')">${S.cf==='c'+c.id?'تأیید حذف':'حذف'}</button></div></div>`).join('')}</section>`}).join('')}</div>`},
vis(){
 return `<div class="bar"><h2 style="margin:0">بازدیدهای امروز</h2><button class="btn" onclick="addVis()">بازدید جدید</button></div>
 <div class="card">${S.vis.length?S.vis.map((v,i)=>`<div class="vis ${v.d?'done':''}"><time>${P(v.t)}</time><div>${esc(v.c)}<div class="meta">${esc(v.f)}</div></div><button class="btn ghost sm" onclick="tg(${i})">${v.d?'برگرداندن':'انجام شد'}</button></div>`).join(''):'<p class="empty">بازدیدی ثبت نشده. اولین بازدید را اضافه کنید.</p>'}</div>`},
pub(){
 const L=S.files.filter(f=>f.st==='فعال'),pr=S.prof,on=L.filter(f=>f.pub!==false).length;
 return `<div class="bar"><h2 style="margin:0">ویترین مشتری</h2><div class="row" style="margin:0"><button class="btn ghost" onclick="preview()">پیش‌نمایش</button><button class="btn" onclick="dlShow()">دانلود فایل ویترین</button></div></div>
 ${(()=>{const c=ghc();return `<div class="card" style="margin-bottom:12px"><h3>انتشار خودکار در سایت</h3><p class="meta">${c?'متصل است. هر تغییر در فایل‌ها یا اطلاعات ویترین خودکار روی سایت می‌رود.':'برای این‌که هر فایل ثبت‌شده خودکار در سایت دیده شود، یک بار به سایت وصل شوید.'}</p><div class="mv">${c?`<button class="btn sm" onclick="pubSite(true)">انتشار همین الان</button><button class="btn ghost sm" onclick="ghAuto()">انتشار خودکار: ${c.auto?'روشن':'خاموش'}</button><button class="btn ghost sm" onclick="ghOff()">قطع اتصال</button>`:'<button class="btn sm" onclick="setupGH()">اتصال به سایت</button>'}</div></div>`})()}
 <div class="two"><div class="card"><h3>اطلاعات تماس شما</h3><p class="meta">${pr.ph?'موبایل: '+P(esc(pr.ph)):'شماره‌ای ثبت نشده'}<br>${esc(pr.ad||'آدرس ثبت نشده')}<br>بله: ${esc(pr.bl||'—')} · اینستاگرام: ${esc(pr.ig||'—')}</p><button class="btn ghost sm" onclick="setProf()">ویرایش</button></div>
 <div class="card"><h3>مشتری چه چیزی می‌بیند؟</h3><p class="meta">فقط عنوان، محله، قیمت، متراژ، تعداد خواب، طبقه و امکانات. کمیسیون، اطلاعات مالک، لیست مشتری‌ها و برنامه‌ی شما هرگز در ویترین نیست.</p></div></div>
 <div class="card" style="margin-top:12px"><h3>فایل‌های قابل نمایش (${N(on)} از ${N(L.length)})</h3>${L.length?L.map(f=>`<div class="vis"><div>${esc(f.t)}<div class="meta">${esc(f.a)} · ${fmt(f.p)}</div></div><button class="btn ${f.pub===false?'ghost ':''}sm" onclick="tgPub('${f.id}')">${f.pub===false?'پنهان':'نمایش'}</button></div>`).join(''):'<p class="empty">هنوز فایل فعالی ندارید.</p>'}</div>`},
inc(){
 const r=rl(),act=S.files.filter(x=>x.st==='فعال'),avg=act.length?act.reduce((a,x)=>a+(x.cm||0),0)/act.length:0,rem=Math.max(0,S.goal-r),need=avg?Math.ceil(rem/avg):0,pc=Math.min(100,Math.round(r/S.goal*100));
 return `<div class="bar"><h2 style="margin:0">درآمد</h2><button class="btn ghost" onclick="setGoal()">تغییر هدف</button></div>
 <div class="stats"><div class="card stat"><b>${N(r)}</b><span>میلیون تومان، ۳۰ روز اخیر</span></div><div class="card stat"><b>${N(fc())}</b><span>پیش‌بینی پرونده‌های جاری</span></div><div class="card stat"><b>${N(S.goal)}</b><span>هدف ماهانه</span></div><div class="card stat"><b>${N(S.deals.length)}</b><span>قرارداد ثبت‌شده</span></div></div>
 <div class="card" style="margin-bottom:12px"><div class="prog"><div style="width:${pc}%"></div></div><p style="margin:0">${rem?(need?`برای رسیدن به هدف حدود <b>${N(need)}</b> معامله‌ی دیگر لازم است. میانگین کمیسیون فایل‌های فعال شما ${fmt(Math.round(avg))} است.`:'برای محاسبه، اول فایل فعال با کمیسیون ثبت کنید.'):'به هدف این ماه رسیدید.'}</p></div>
 <div class="card"><h3>قراردادها</h3>${S.deals.length?[...S.deals].reverse().map(x=>`<div class="vis"><div>${esc(x.c)}<div class="meta">${esc(x.f)} · ${N(ago(x.d))} روز پیش</div></div><b>${fmt(x.cm)}</b></div>`).join(''):'<p class="empty">وقتی مشتری را به مرحله‌ی قرارداد ببرید، کمیسیون اینجا ثبت می‌شود.</p>'}</div>`}
};
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#view').innerHTML=V[S.tab]();
}
render();
try{const raw=localStorage.getItem(KEY);if(raw)loadState(JSON.parse(raw))}catch(e){}
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let IP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;$('#ib').hidden=false});
function inst(){if(IP){IP.prompt();IP=null;$('#ib').hidden=true}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
